name: Sync domain from ssb.txt

on:
  schedule:
    - cron: '12 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync ssb.txt -> .ssb.bak & cookie-auto-delete.json
        run: |
          python3 - <<'EOF'
          import urllib.request, re, time, os

          RAW  = "https://raw.githubusercontent.com/Amid7197/js/refs/heads/main/yh_js/ssb.txt"
          BAK  = "cookie-sync/.ssb.bak"
          JSON = "cookie-sync/cookie-auto-delete.json"

          # 1) 拉取远端 ssb.txt，统一换行符
          remote = urllib.request.urlopen(RAW, timeout=30).read().decode("utf-8")
          remote = remote.replace("\r\n", "\n")
          remote_first = remote.splitlines()[0].strip() if remote.strip() else ""
          print("远端第一行:", remote_first)

          # 2) 读取本地 .ssb.bak
          if os.path.exists(BAK):
              with open(BAK, encoding="utf-8") as f:
                  local = f.read().replace("\r\n", "\n")
          else:
              local = None
              print("本地 .ssb.bak 不存在（首次运行）")

          if local is not None and local == remote:
              print("ssb.txt 与 .ssb.bak 一致，无需修改")
              raise SystemExit(0)

          # 3) 不一致：用 .ssb.bak 第一行去 JSON 搜索替换
          if local is None:
              print("首次运行：只写入 .ssb.bak，JSON 不自动改（没有旧值可搜索）")
          else:
              local_first = local.splitlines()[0].strip() if local.strip() else ""
              print(f"旧第一行: {local_first!r} -> 新第一行: {remote_first!r}")

              if local_first and local_first != remote_first:
                  with open(JSON, encoding="utf-8") as f:
                      content = f.read()

                  if local_first in content:
                      content = content.replace(local_first, remote_first)
                      # 4) 同步更新第 4 行 updatedAt 为当前毫秒时间戳
                      now_ms = int(time.time() * 1000)
                      content = re.sub(
                          r'("updatedAt"\s*:\s*)\d+',
                          lambda m: m.group(1) + str(now_ms),
                          content,
                      )
                      with open(JSON, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"已在 JSON 中替换域名，updatedAt -> {now_ms}")
                  else:
                      print("警告：JSON 中未找到旧第一行，JSON 未修改")
              elif local_first == remote_first:
                  print("第一行相同，仅更新 .ssb.bak，不改 JSON")

          # 5) 更新 .ssb.bak 为远端全文
          with open(BAK, "w", encoding="utf-8") as f:
              f.write(remote)
          print("已写入 .ssb.bak")
          EOF

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先 add（含新文件 .ssb.bak），再用 --cached 判断是否有变更
          git add cookie-sync/cookie-auto-delete.json cookie-sync/.ssb.bak

          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi

          git commit -m "chore: sync domain from ssb.txt"
          git push
